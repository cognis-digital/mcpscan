[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-mcpscan"
version = "1.0.0"
description = "The MCP-server security suite — scan, harden, gate, and pin your Model Context Protocol servers. 7 modules, one command."
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["ai-security", "mcp", "mcp-server", "model-context-protocol", "llm-security", "agent-security", "prompt-injection", "ssrf", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/mcpscan"

[project.scripts]
mcpscan = "mcpscan.suite:main"
"mcpscan-emit" = "mcpscan.connect:emit_main"
mcpharden = "mcpharden.cli:main"
"mcpharden-emit" = "mcpharden.connect:emit_main"
mcpauth = "mcpauth.cli:main"
"mcpauth-emit" = "mcpauth.connect:emit_main"
mcppin = "mcppin.cli:main"
"mcppin-emit" = "mcppin.connect:emit_main"
ssrfmcp = "ssrfmcp.cli:main"
"ssrfmcp-emit" = "ssrfmcp.connect:emit_main"
promptmirror = "promptmirror.cli:main"
"promptmirror-emit" = "promptmirror.connect:emit_main"
trustgate = "trustgate.cli:main"
"trustgate-emit" = "trustgate.connect:emit_main"

[tool.hatch.build.targets.wheel]
packages = ['mcpscan', 'mcpharden', 'mcpauth', 'mcppin', 'ssrfmcp', 'promptmirror', 'trustgate']
artifacts = ["mcpscan/data/*.json"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests", "qa"]
addopts = "--import-mode=importlib"
