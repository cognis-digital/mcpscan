name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . || pip install pytest
      - name: Test
        shell: bash
        run: |
          if compgen -G "tests/*.py" > /dev/null; then
            python -m pytest -q
          else
            echo "no tests present — skipping"
          fi
      - name: Demo
        shell: bash
        run: |
          python -m mcpscan --version
          python -m mcpscan scan demos/01-basic/vulnerable_mcp_server.py --format json
          python -m mcpscan scan demos/02-deep/vulnerable_agent_server.py --format json
          python -m mcpscan scan demos/02-deep/ --format html --out /tmp/r.html
          python -m mcpscan scan demos/02-deep/ --format badge
          # --ai with no backend configured must still succeed on rules only:
          python -m mcpscan scan demos/02-deep/ --ai --format json
